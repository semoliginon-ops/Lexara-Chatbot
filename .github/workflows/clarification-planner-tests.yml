name: Clarification Planner Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/clarification_planner.py"
      - "tests/test_clarification_planner.py"
      - ".github/workflows/clarification-planner-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarification-planner-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Run exactly 11 clarification planner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exactly 11 focused tests
        run: python -m unittest discover -s tests -p "test_clarification_planner.py" -v
