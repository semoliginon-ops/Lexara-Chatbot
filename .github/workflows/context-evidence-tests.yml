name: Context Evidence Generator Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/context_evidence_generator.py"
      - "tests/test_context_evidence_generator.py"
      - ".github/workflows/context-evidence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-evidence-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Run Context Evidence Generator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused tests only
        run: python -m unittest tests.test_context_evidence_generator -v
