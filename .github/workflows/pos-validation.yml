name: POS Dataset, Lexical Relations, and Regression Validation

on:
  push:
    branches: [main]
    paths:
      - "docs/VALIDASI_KAMUS_5_BATCH.txt"
      - "tools/validasi_valensi.py"
      - "tests/test_validasi_valensi.py"
      - "tests/test_valency_pilot_integration.py"
      - "data/kamus/batch-*.jsonl"
      - ".github/workflows/pos-validation.yml"
  workflow_dispatch:
    inputs:
      batch_start:
        description: "Nomor batch pertama (1-60)"
        required: true
        default: "1"
      batch_end:
        description: "Nomor batch terakhir (maksimal 5 batch)"
        required: true
        default: "5"

permissions:
  contents: read

concurrency:
  group: language-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate selected five-batch group
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select batch range
        id: batch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            read START END < docs/VALIDASI_KAMUS_5_BATCH.txt
          else
            START="${{ inputs.batch_start }}"
            END="${{ inputs.batch_end }}"
          fi
          if ! [[ "$START" =~ ^[0-9]+$ && "$END" =~ ^[0-9]+$ ]] || (( START < 1 || END > 60 || END < START || END - START > 4 )); then
            echo "Rentang batch tidak valid; maksimum lima batch." >&2
            exit 1
          fi
          printf "start=%03d\nend=%03d\n" "$START" "$END" >> "$GITHUB_OUTPUT"

      - name: Validate lexical relations for selected batches
        shell: bash
        run: |
          files=()
          for ((i=10#${{ steps.batch.outputs.start }}; i<=10#${{ steps.batch.outputs.end }}; i++)); do
            printf -v n "%03d" "$i"
            files+=("data/kamus/batch-${n}.jsonl")
          done
          python -m tools.validasi_relasi_leksikal "${files[@]}"

      - name: Validate full 3,014-lemma dictionary
        run: python -m tools.validasi_kamus_lengkap

      - name: Validate per-sense valency metadata
        run: python -m tools.validasi_valensi data/kamus/batch-*.jsonl

      - name: Validate POS dataset
        run: python -m tools.validasi_dataset_pos

      - name: Evaluate development split only
        run: python -m tools.evaluasi_pos

      - name: Run full regression suite
        run: python -m unittest discover -s tests -q
