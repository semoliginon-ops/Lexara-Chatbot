name: Dictionary Audit

on:
  # Audit dijalankan manual saat kamus mencapai 3.000 entri atau ketika audit besar diperlukan.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dictionary-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only dictionary checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dictionary audit
        run: |
          python tools/audit_dictionary.py \
            --docs docs/KAMUS.md \
            --index data/kamus/INDEX.md \
            --data-dir data/kamus
